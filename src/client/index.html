<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Title & Meta -->
    <title>Addon AI - Your Autonomous AI CMO &amp; Growth Team</title>
    <meta name="description" content="Truck Mitra connects shippers with 50,000+ verified trucks across India. Get instant freight quotes, live GPS tracking, and transparent transport rates 24/7." />
    <meta name="keywords" content="Truck Mitra, truck booking, freight transport, online truck booking India, logistics company, fleet management, FTL transport, road freight, truck transport Delhi Mumbai" />
    <meta name="author" content="Truck Mitra" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://truckmitra.in/" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Truck Mitra" />
    <meta property="og:url" content="https://truckmitra.in/" />
    <meta property="og:title" content="Truck Mitra - Online Truck Transport, Freight Booking &amp; Logistics India" />
    <meta property="og:description" content="Book verified trucks across India with instant freight rates, transparent billing, and 24/7 live fleet tracking." />
    <meta property="og:image" content="https://truckmitra.in/assets/og-banner.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Truck Mitra Digital Freight and Commercial Truck Transport Network" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@truckmitra" />
    <meta name="twitter:creator" content="@truckmitra" />
    <meta name="twitter:title" content="Truck Mitra - Online Truck Transport, Freight Booking &amp; Logistics India" />
    <meta name="twitter:description" content="Book verified trucks across India with instant freight rates, transparent billing, and 24/7 live fleet tracking." />
    <meta name="twitter:image" content="https://truckmitra.in/assets/og-banner.png" />
    <meta name="twitter:image:alt" content="Truck Mitra Digital Freight Network" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="theme-color" content="#1E3A8A" />

    <!-- High Performance Preconnects & DNS Prefetch -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Critical Inlined CSS for Instant LCP < 2.5s and TBT < 200ms -->
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        background-color: #F9F9F7;
        color: #0F172A;
        -webkit-font-smoothing: antialiased;
      }
      #root { min-height: 100vh; }
      .seo-nav-link { color: #475569; text-decoration: none; transition: color 0.15s ease; }
      .seo-nav-link:hover { color: #2563EB; }
    </style>

    <!-- Structured Data (JSON-LD): Organization & LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": ["Organization", "LocalBusiness"],
          "@id": "https://truckmitra.in/#organization",
          "name": "Truck Mitra",
          "alternateName": ["TruckMitra", "Truck Mitra Logistics", "Truck Mitra Transport"],
          "url": "https://truckmitra.in",
          "logo": {
            "@type": "ImageObject",
            "url": "https://truckmitra.in/logo.png",
            "width": 512,
            "height": 512
          },
          "image": "https://truckmitra.in/assets/og-banner.png",
          "description": "Truck Mitra is India's leading digital freight booking, commercial truck transport marketplace, and verified fleet network connecting shippers with 50,000+ carriers.",
          "telephone": "+91-80767-45291",
          "email": "support@truckmitra.in",
          "priceRange": "₹₹",
          "currenciesAccepted": "INR",
          "paymentAccepted": "Cash, Credit Card, Bank Transfer, UPI, FASTag",
          "areaServed": [
            {
              "@type": "Country",
              "name": "India"
            }
          ],
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Truck Mitra Transport Hub, Outer Ring Road, Transport Nagar",
            "addressLocality": "Delhi NCR",
            "addressRegion": "Delhi",
            "postalCode": "110042",
            "addressCountry": "IN"
          },
          "contactPoint": [
            {
              "@type": "ContactPoint",
              "telephone": "+91-80767-45291",
              "contactType": "customer support",
              "areaServed": "IN",
              "availableLanguage": ["English", "Hindi"]
            },
            {
              "@type": "ContactPoint",
              "telephone": "+91-80767-45291",
              "contactType": "sales",
              "areaServed": "IN",
              "availableLanguage": ["English", "Hindi"]
            }
          ],
          "openingHoursSpecification": [
            {
              "@type": "OpeningHoursSpecification",
              "dayOfWeek": [
                "Monday",
                "Tuesday",
                "Wednesday",
                "Thursday",
                "Friday",
                "Saturday",
                "Sunday"
              ],
              "opens": "00:00",
              "closes": "23:59"
            }
          ],
          "sameAs": [
            "https://www.linkedin.com/company/truckmitra",
            "https://www.facebook.com/truckmitra",
            "https://www.instagram.com/truckmitra",
            "https://www.youtube.com/@truckmitra"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://truckmitra.in/#website",
          "url": "https://truckmitra.in",
          "name": "Truck Mitra",
          "description": "Online Commercial Truck Transport & Freight Marketplace India",
          "publisher": {
            "@id": "https://truckmitra.in/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://truckmitra.in/?s={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>
  <body class="bg-[#F9F9F7] text-neutral-900 font-['Plus_Jakarta_Sans',sans-serif] antialiased selection:bg-neutral-900 selection:text-white min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
