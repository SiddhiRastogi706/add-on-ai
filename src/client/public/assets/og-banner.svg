<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <!-- Glowing circle accent -->
  <circle cx="1050" cy="200" r="300" fill="#2563EB" opacity="0.15" filter="blur(80px)" />
  <circle cx="150" cy="500" r="250" fill="#10B981" opacity="0.12" filter="blur(70px)" />
  
  <!-- Brand Header -->
  <g transform="translate(100, 110)">
    <rect width="64" height="64" rx="16" fill="url(#accent)" />
    <!-- Mini truck icon -->
    <path d="M18 38 L22 38 M42 38 L46 38 M16 26 L36 26 L36 40 L16 40 Z M36 30 L44 30 L48 35 L48 40 L36 40 Z" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="24" cy="40" r="3" fill="#FFFFFF" />
    <circle cx="42" cy="40" r="3" fill="#FFFFFF" />
    <text x="80" y="44" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="1">TRUCK MITRA</text>
  </g>

  <!-- Big Title -->
  <text x="100" y="270" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="56" fill="#FFFFFF">India's #1 Digital Freight &amp;</text>
  <text x="100" y="340" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="56" fill="url(#accent)">Commercial Truck Booking</text>
  
  <!-- Description -->
  <text x="100" y="415" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="500" font-size="24" fill="#94A3B8">Connect with 50,000+ verified fleet owners. Instant FTL quotes &amp; live GPS tracking.</text>

  <!-- Badges -->
  <g transform="translate(100, 480)">
    <rect width="210" height="52" rx="26" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <text x="105" y="32" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="16" fill="#F8FAFC" text-anchor="middle">⚡ 50,000+ Trucks</text>
  </g>
  <g transform="translate(330, 480)">
    <rect width="210" height="52" rx="26" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <text x="105" y="32" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="16" fill="#10B981" text-anchor="middle">✓ Zero Hidden Fees</text>
  </g>
  <g transform="translate(560, 480)">
    <rect width="210" height="52" rx="26" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <text x="105" y="32" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="16" fill="#60A5FA" text-anchor="middle">📍 24/7 Live GPS</text>
  </g>
  <g transform="translate(790, 480)">
    <rect width="260" height="52" rx="26" fill="url(#accent)" />
    <text x="130" y="32" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="16" fill="#FFFFFF" text-anchor="middle">https://truckmitra.in ➔</text>
  </g>
