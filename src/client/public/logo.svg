<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="addonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="128" fill="url(#addonGradient)" />

  <!-- Brain & AI Circuit Silhouette -->
  <g filter="url(#softGlow)" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center AI Node -->
    <circle cx="256" cy="256" r="32" fill="#FFFFFF" stroke="none" />
    <circle cx="256" cy="256" r="54" stroke-width="6" opacity="0.4" />
    <circle cx="256" cy="256" r="76" stroke-width="4" stroke-dasharray="8 8" opacity="0.6" />

    <!-- Left Circuit Hemisphere -->
    <path d="M224 256 H 144 C 120 256 100 236 100 212 C 100 188 120 168 144 168 C 152 144 176 128 204 128 C 220 128 236 136 244 148 V 224" stroke-width="12" />
    <path d="M224 256 H 144 C 120 256 100 276 100 300 C 100 324 120 344 144 344 C 152 368 176 384 204 384 C 220 384 236 376 244 364 V 288" stroke-width="12" />

    <!-- Right Circuit Hemisphere -->
    <path d="M288 256 H 368 C 392 256 412 236 412 212 C 412 188 392 168 368 168 C 360 144 336 128 308 128 C 292 128 276 136 268 148 V 224" stroke-width="12" />
    <path d="M288 256 H 368 C 392 256 412 276 412 300 C 412 324 392 344 368 344 C 360 368 336 384 308 384 C 292 384 276 376 268 364 V 288" stroke-width="12" />

    <!-- Neural Circuit Nodes -->
    <circle cx="144" cy="168" r="14" fill="#FFFFFF" stroke="none" />
    <circle cx="144" cy="344" r="14" fill="#FFFFFF" stroke="none" />
    <circle cx="204" cy="128" r="14" fill="#FFFFFF" stroke="none" />
    <circle cx="204" cy="384" r="14" fill="#FFFFFF" stroke="none" />
    <circle cx="368" cy="168" r="14" fill="#FFFFFF" stroke="none" />
    <circle cx="368" cy="344" r="14" fill="#FFFFFF" stroke="none" />
    <circle cx="308" cy="128" r="14" fill="#FFFFFF" stroke="none" />
    <circle cx="308" cy="384" r="14" fill="#FFFFFF" stroke="none" />
  </g>
</svg>
